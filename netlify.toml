[build]
command = "npm run build:netlify"
publish = "frontend/build"
image = "ubuntu:noble"

[build.environment]
NODE_VERSION = "22"
NPM_VERSION = "10"

# Note: @netlify/plugin-sitemap was removed. It generates sitemaps by
# crawling HTML files in the publish directory, but this is a client-side
# rendered SPA (Vite + React Router) that only outputs a single index.html,
# so the plugin could only ever discover the "/" route. A complete
# sitemap.xml covering all public routes is now generated directly by
# frontend/scripts/generate-sitemap.js as part of `npm run build`.

# ── Deploy-preview context (PRs / branch deploys) ────────
[context.deploy-preview]
command = "npm run build:netlify"

[context.deploy-preview.environment]
NODE_ENV = "staging"

# ── Cache hints for static pages (better SEO / FCP) ────
[[headers]]
for = "/about"
[headers.values]
Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
for = "/privacy"
[headers.values]
Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
for = "/terms"
[headers.values]
Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[redirects]]
from = "/contact"
to = "/support?tab=contact"
status = 301

# ── Security headers (all pages) ──────────────────────────────
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://mern-plan-web-service.onrender.com https://*.stripe.com https://api.github.com https://localhost:3444 https://localhost:3001 https://127.0.0.1:3444 https://127.0.0.1:3001; frame-src https://*.stripe.com;"

# ── Immutable caching for hashed Vite assets ──────────────────
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# ── Short cache for HTML (always revalidate) ──────────────────
[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# ── Moderate cache for images / icons ─────────────────────────
[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.ico"
[headers.values]
Cache-Control = "public, max-age=86400"

# ── Redirects ─────────────────────────────────────────────────
# Proxy API calls to the Render backend
[[redirects]]
from = "/api/*"
to = "https://mern-plan-web-service.onrender.com/api/:splat"
status = 200
force = true

# Legacy /LegalTerms stub → redirect to /terms
[[redirects]]
from = "/LegalTerms"
to = "/terms"
status = 301
force = true

# SPA catch-all (must be last)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
