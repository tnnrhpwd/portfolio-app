# Continuous Integration Workflow
# Runs tests and linting on all PRs

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 is the floor for sharp@0.35 in the backend job below and
          # for Vite 7 in the frontend job. Deploys are newer still: Render
          # reads the repo-root .nvmrc (24), Netlify pins 22.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Check Prettier formatting
        run: npm run format:check
        continue-on-error: true

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # The ROOT Jest config is the canonical frontend runner (see
      # .github/copilot-instructions.md). Running `npm test` inside frontend/
      # instead resolves frontend/package.json's own jest block, which has no
      # `testEnvironment` — so every DOM/localStorage suite dies with
      # "document is not defined" (19 suites / 149 tests) and a PNG import
      # breaks its suite, because that config maps only css/svg. Same tests,
      # wrong runner: the root config runs the whole suite green. Do not
      # "simplify" this back to a `npm test` in frontend/.
      - name: Install root dependencies (where the canonical Jest config lives)
        run: npm ci

      - name: Run frontend tests
        run: node node_modules/jest/bin/jest.js --config package.json frontend/src
        env:
          CI: true

  test-simple-addon:
    name: Simple Addon Tests + Eval
    # Windows-hosted: the automation tools under simple-addon/server/automation
    # shell out to PowerShell/UIA, matching the addon's own build-addon.yml runner.
    runs-on: windows-latest

    defaults:
      run:
        working-directory: simple-addon

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: simple-addon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      # §5.5 CI gate: fails the build if any automation/eval/scenarios/*.json
      # scenario regresses from pass to fail (npm run eval exits non-zero on
      # any scenario failure — see server/automation/eval/cli.js).
      - name: Run eval scenario suite (no pass-rate regression allowed)
        run: npm run eval

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vite 7 declares engines ^20.19.0 || >=22.12.0, so Node 18 fails the
          # build outright ("Vite requires Node.js version 20.19+"). This job did
          # not run for a while — it needs lint/test-backend/test-frontend, and
          # test-frontend was red — so the mismatch only surfaced once that was
          # fixed. Keep this at 20+ (the backend and addon jobs already are).
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false # Warnings shouldn't fail build
