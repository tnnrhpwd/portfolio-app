<?xml version="1.0" encoding="UTF-8"?>
<!-- The Simple brand mark — MASTER ARTWORK (compact / badge variant).

  THE SMALL-SIZE MARK: a ring, a field and a tick inside it. This is what the
  browser tab and the desktop addon show, and it is deliberately NOT the live header
  mark.

  WHY IT IS A SEPARATE PIECE OF ARTWORK AND NOT THE `full` MARK SHRUNK

  Two differences, both on purpose:

  1. THE TICK SITS INSIDE THE FIELD. On the `full` mark the check crosses the ring and
     overshoots it to the upper right. That is a lovely detail at 38px and beyond, and
     at 16px it reads as a smudge against the ring band it crosses. Here the tick is
     confined, so the three elements stack cleanly at any size.

  2. THE PROPORTIONS ARE CHUNKIER. The ring is 5.5 units where the `full` mark's is
     4.25, because a 1.1px ring in a 16px tab icon is a rumour. Everything inside was
     sized to what survives 16px rather than to what looks balanced at 256.

  COLOUR: MONOCHROME, AND THAT IS THE POINT. These are files a browser, the Windows
  shell and electron-builder read, and none of them can see the visitor's colour scheme,
  so this mark cannot follow it (docs/guides/LOGO_SYSTEM.md sections 5 and 6). It is
  drawn in BLACK and WHITE rather than in the identity hues, because a coloured pair only
  ever looks right on the palette it was drawn for — and every one of these surfaces sits
  on chrome this mark does not control: a dark tab strip, a light taskbar, an
  accent-tinted title bar, whatever wallpaper the user picked.

  HOW IT READS IS THE SAME EITHER WAY, and that is the whole reason to go monochrome. On a
  LIGHT surface the field disappears into the chrome, so the mark reads as a hollow black
  circle with a tick. On a DARK surface the field reads as a solid white disc and the ring
  becomes that disc's edge. Neither is a degraded version of the other — verified by
  rendering every size below 64px on both a light and a dark strip and magnifying the
  result pixel for pixel.

  What makes that work is that the ring and the tick are always drawn against the FIELD,
  never against the surface behind the mark. The previous blue and teal pair could never
  promise this: it was chosen for a light page, and on a dark taskbar the teal field and
  the blue ring collapsed toward each other.

  KEEP THE CHECK PATH IN STEP with brand-mark.svg — it is the same three points, only
  recentred and scaled (0.72). The scale is the largest that keeps the tick's furthest
  corner (the tip, 31.44 from the check's own centre) inside the field's 25.5 radius.

  Zero background by design — no rect, and there should never be one.

  NOTE FOR EDITORS: no doubled hyphen may appear in these comments, NOT EVEN AS A
  HEADING UNDERLINE. XML forbids the sequence inside a comment, and librsvg reports the
  violation as "corrupt header" rather than as a syntax error, so the message names
  nothing about comments. This warning is here because it was learned twice. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="256"
     height="256"
     role="img"
     aria-label="Simple">
    <title>Simple</title>
    <!-- The field: white, at the ring's inner radius plus a hair of overlap so no
       anti-aliasing seam shows between the two. -->
    <circle cx="32"
            cy="32"
            r="25.5"
            fill="#ffffff" />
    <!-- The tick: black, centred on the field and confined to it. -->
    <path d="M14.8 29.28 L27.67 44.14 L59.44 5.96"
          fill="none"
          stroke="#000000"
          stroke-width="8.51"
          stroke-linecap="butt"
          stroke-linejoin="miter"
          transform="translate(32 32) scale(0.72) translate(-37.13 -26.97)" />
    <!-- The ring, drawn last so its edge stays crisp over the field. -->
    <circle cx="32"
            cy="32"
            r="28"
            fill="none"
            stroke="#000000"
            stroke-width="5.5" />
</svg>
