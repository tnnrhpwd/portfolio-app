<?xml version="1.0" encoding="UTF-8" ?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 900"
     preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="bg"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0"
                  stop-color="#ff379b" />
            <stop offset="1"
                  stop-color="#ff732e" />
        </linearGradient>
        <radialGradient id="glow"
                        cx="0.5"
                        cy="0.5"
                        r="0.5">
            <stop offset="0"
                  stop-color="#ffffff"
                  stop-opacity="0.95" />
            <stop offset="1"
                  stop-color="#ffffff"
                  stop-opacity="0" />
        </radialGradient>
    </defs>
    <rect width="1200"
          height="900"
          fill="url(#bg)" />
    <g stroke="#ffffff"
       stroke-opacity="0.6"
       stroke-width="10">
        <line x1="600"
              y1="120"
              x2="340"
              y2="380" />
        <line x1="600"
              y1="120"
              x2="860"
              y2="380" />
        <line x1="340"
              y1="380"
              x2="340"
              y2="650" />
        <line x1="860"
              y1="380"
              x2="860"
              y2="650" />
    </g>
    <circle cx="600"
            cy="120"
            r="70"
            fill="url(#glow)" />
    <circle cx="340"
            cy="380"
            r="56"
            fill="#ffffff"
            opacity="0.85" />
    <circle cx="860"
            cy="380"
            r="56"
            fill="#ffffff"
            opacity="0.65" />
    <circle cx="340"
            cy="650"
            r="72"
            fill="#ffd166"
            opacity="0.9" />
    <circle cx="860"
            cy="650"
            r="72"
            fill="url(#glow)" />
</svg>
