# Render Blueprint — defines the backend web service declaratively.
#
# This is the single source of truth for how the backend should be built and
# run on Render. Use it with Render's "Blueprint" flow (New + → Blueprint),
# or mirror these exact values in the existing service's
# Settings → Build & Deploy:
#
#   Root Directory   : backend
#   Build Command    : npm run build
#   Start Command    : npm run server
#   Install Command  : npm install        <-- this is the one that was missing
#
# Do NOT commit secrets here.
#
# Secrets strategy: AWS Secrets Manager is the single source of truth for all
# non-AWS secrets (Stripe, JWT, DeepSeek, GitHub token, ...). The
# backend hydrates them into process.env at boot via backend/utils/awsSecrets.js
# (loadAllSecrets). Render therefore only needs the AWS bootstrap credentials so
# the service can reach Secrets Manager:
#
#   AWS_ACCESS_KEY_ID      — Render env var (set once)
#   AWS_SECRET_ACCESS_KEY  — Render env var (set once)
#
# Add or rotate any other secret with:
#   npm run secret:put -- -Name SECRET_NAME -Value "value"
# then redeploy (or restart) — no Render dashboard edits needed.
services:
  - type: web
    name: mern-plan-web-service
    runtime: node
    rootDir: backend
    plan: free
    installCommand: npm install
    # Node version is read from the repo-root .nvmrc (currently 22).
    buildCommand: npm run build
    # Must be `npm run server` — it resolves to `node server.js` in backend/package.json
    # (nodemon is a devDependency and is NOT installed in production).
    startCommand: npm run server
    healthCheckPath: /health
